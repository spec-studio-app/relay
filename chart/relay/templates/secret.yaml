{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relay.fullname" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  OWNER_PASSWORD_HASH: {{ required "secrets.ownerPasswordHash is required (a bcrypt hash of the owner password)" $s.ownerPasswordHash | quote }}
  PAYLOAD_KEYS: {{ required "secrets.payloadKeys is required (run: docker run --rm ghcr.io/spec-studio-app/relay keys)" $s.payloadKeys | quote }}
  {{- range $key, $value := dict "TEMPORAL_API_KEY" $s.temporalApiKey "TEMPORAL_TLS_CERT" $s.temporalTlsCert "TEMPORAL_TLS_KEY" $s.temporalTlsKey "BUCKET_ACCESS_KEY" $s.bucketAccessKey "BUCKET_SECRET_KEY" $s.bucketSecretKey }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
