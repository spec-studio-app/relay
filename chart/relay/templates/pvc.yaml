{{- if and (include "relay.dataVolume" .) (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "relay.claimName" . }}
  labels:
    {{- include "relay.labels" . | nindent 4 }}
  annotations:
    # The relay's state is on this volume: keep it when the release is removed.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
