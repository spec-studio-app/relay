name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The plugin store tests run against the plugin-sdk memory plugin, at the
      # commit of the copied client (src/vendor/plugin-sdk/SOURCE.md).
      - uses: actions/checkout@v4
        with:
          repository: spec-studio-app/plugin-sdk
          ref: 2834b2ad914418fb756190337517b094b945bc07
          path: .plugin-sdk
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Build the memory plugin
        run: |
          (cd .plugin-sdk/examples/memory && go build -o "$RUNNER_TEMP/memory" .)
          echo "RELAY_TEST_PLUGIN=$RUNNER_TEMP/memory" >> "$GITHUB_ENV"
          echo "RELAY_REQUIRE_PLUGIN=1" >> "$GITHUB_ENV"
      # The tests run a Temporal dev server from the Temporal CLI.
      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "TEMPORAL_CLI=$HOME/.temporalio/bin/temporal" >> "$GITHUB_ENV"
      - run: npm test
      - uses: azure/setup-helm@v4
      - name: Lint the chart
        run: |
          helm lint chart/relay \
            --set publicUrl=https://relay.example.com \
            --set temporal.address=temporal:7233 \
            --set secrets.ownerPasswordHash=x \
            --set secrets.payloadKeys=y
          helm template relay chart/relay \
            --set publicUrl=https://relay.example.com \
            --set temporal.address=temporal:7233 \
            --set secrets.ownerPasswordHash=x \
            --set secrets.payloadKeys=y > /dev/null
