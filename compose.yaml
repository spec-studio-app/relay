# Spec Studio relay with Docker Compose.
#
#   The JSON store (the default):  docker compose up
#   Your own Temporal:             set TEMPORAL_ADDRESS and PAYLOAD_KEYS in .env
#                                  (RELAY_STORE=temporal is optional), then
#                                  docker compose up
#   A local dev Temporal:          set TEMPORAL_ADDRESS=temporal:7233 and
#                                  PAYLOAD_KEYS in .env, then
#                                  docker compose --profile dev up
#   A backend plugin:              set RELAY_PLUGIN (a command in the image)
#                                  or RELAY_PLUGIN_URL and RELAY_PLUGIN_TOKEN
#                                  (a sidecar, see the plugin service below),
#                                  and leave RELAY_STORE empty
#
# Put the settings in a .env file next to this file (see README.md). Quote the
# password hash in single quotes: it holds `$` characters.
services:
  relay:
    image: ghcr.io/spec-studio-app/relay:${RELAY_VERSION:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${RELAY_PORT:-8760}:8760"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8760}
      OWNER_PASSWORD_HASH: "${OWNER_PASSWORD_HASH:?Set OWNER_PASSWORD_HASH to a bcrypt hash of the owner password}"
      # json or temporal. Empty: temporal when TEMPORAL_ADDRESS is set, else json.
      RELAY_STORE: ${RELAY_STORE:-}
      # The Temporal store only: make PAYLOAD_KEYS with docker run --rm ghcr.io/spec-studio-app/relay keys
      PAYLOAD_KEYS: "${PAYLOAD_KEYS:-}"
      # The dev profile's Temporal is temporal:7233.
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      TEMPORAL_AUTH: ${TEMPORAL_AUTH:-}
      TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
      TEMPORAL_TLS_CERT: ${TEMPORAL_TLS_CERT:-}
      TEMPORAL_TLS_KEY: ${TEMPORAL_TLS_KEY:-}
      DEPLOY_ID: ${DEPLOY_ID:-default}
      TASK_QUEUE: ${TASK_QUEUE:-}
      BUCKET_ENDPOINT: ${BUCKET_ENDPOINT:-}
      BUCKET_NAME: ${BUCKET_NAME:-}
      BUCKET_ACCESS_KEY: ${BUCKET_ACCESS_KEY:-}
      BUCKET_SECRET_KEY: ${BUCKET_SECRET_KEY:-}
      BUCKET_REGION: ${BUCKET_REGION:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
      UI_ORIGIN: ${UI_ORIGIN:-}
      EXTRA_REDIRECT_URIS: ${EXTRA_REDIRECT_URIS:-}
      CALL_TIMEOUT_MS: ${CALL_TIMEOUT_MS:-}
      # A backend plugin as the store (optional; leave RELAY_STORE empty). A
      # command that the relay starts, or the URL of a plugin sidecar and its
      # token. Each plugin setting is RELAY_PLUGIN_<NAME>; add the ones that
      # your plugin needs here, for example RELAY_PLUGIN_ADDRESS.
      RELAY_PLUGIN: ${RELAY_PLUGIN:-}
      RELAY_PLUGIN_URL: ${RELAY_PLUGIN_URL:-}
      RELAY_PLUGIN_TOKEN: ${RELAY_PLUGIN_TOKEN:-}
    volumes:
      # The JSON store's files. The volume takes the owner of /data in the image.
      - relay-data:/data
    depends_on:
      temporal:
        condition: service_healthy
        required: false

  # A backend plugin as a sidecar (an example). Remove the comments, set the
  # image, and in .env set:
  #   RELAY_PLUGIN_URL=http://plugin:7070/rpc
  #   RELAY_PLUGIN_TOKEN=<a long random string, for example from openssl rand -hex 32>
  # Remove the comment of plugin-data under volumes at the end too. The plugin
  # listens on the Compose network only, with the token.
  #
  # plugin:
  #   image: ghcr.io/me/plugin-mine:1.0.0
  #   restart: unless-stopped
  #   command: ["--listen", "0.0.0.0:7070"]
  #   environment:
  #     PLUGIN_TOKEN: "${RELAY_PLUGIN_TOKEN:?Set RELAY_PLUGIN_TOKEN}"
  #   volumes:
  #     - plugin-data:/data

  # A local Temporal dev server (data in a volume), with the Web UI on port 8233.
  # The Web UI has no sign-in, so it listens on this machine (127.0.0.1) only.
  temporal:
    profiles: ["dev"]
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:8233:8233"
    volumes:
      # The image runs as the temporal user. A new volume at its home folder
      # takes that folder's owner, so the dev server can write its database.
      - temporal-home:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  relay-data:
  temporal-home:
  # The plugin sidecar's files (with the plugin service above).
  # plugin-data:
